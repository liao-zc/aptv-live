name: Update APTV playlist

on:
  schedule:
    # 04:30 Asia/Shanghai (20:30 UTC on the previous day)
    - cron: '30 20 * * *'
    # Retry window at 10:30 Asia/Shanghai if the early run failed
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-aptv-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check and replace dead streams
        shell: powershell
        run: |
          $completed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Write-Host "Update attempt $attempt/3"
              .\update-playlist.ps1
              .\clean-playlist.ps1 -TimeoutSeconds 5 -Concurrency 64 -MinimumChannels 150
              $completed = $true
              break
            } catch {
              Write-Warning $_.Exception.Message
              if ($attempt -lt 3) { Start-Sleep -Seconds 30 }
            }
          }
          if (-not $completed) { throw "All update attempts failed; keeping the previous playlist." }

      - name: Commit refreshed playlist
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- APTV_ALL.m3u
          if (git diff --cached --quiet) {
            Write-Host "No playlist changes."
          } else {
            git commit -m "chore: refresh APTV streams"
            git push
          }
