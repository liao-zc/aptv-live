name: Update APTV playlist

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'sources/**'
      - '.github/workflows/update-playlist.yml'
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: update-aptv-playlist
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        timeout-minutes: 7
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Validate aggregator source
        run: python3 -m py_compile scripts/build_playlist.py

      - name: Discover, probe and rank streams
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APTV_PROBE_NODE: github-ubuntu
        run: |
          success=false
          for attempt in 1 2 3; do
            echo "Aggregation attempt $attempt/3"
            if python3 scripts/build_playlist.py; then
              success=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          if [ "$success" != true ]; then
            echo "All attempts failed; preserving the previous playlist."
            exit 1
          fi

      - name: Commit validated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- APTV_ALL.m3u data/history.json reports/latest.json
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "chore: aggregate and validate APTV streams"
            git pull --rebase origin main
            git push
          fi
