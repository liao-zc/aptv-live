name: Update APTV playlist

on:
  schedule:
    # 04:30 Asia/Shanghai (20:30 UTC on the previous day)
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-aptv-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check and replace dead streams
        shell: powershell
        run: |
          .\update-playlist.ps1
          .\clean-playlist.ps1 -TimeoutSeconds 5 -Concurrency 64

      - name: Commit refreshed playlist
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- APTV_ALL.m3u
          if (git diff --cached --quiet) {
            Write-Host "No playlist changes."
          } else {
            git commit -m "chore: refresh APTV streams"
            git push
          }
